name: Bug report
description: Report a reproducible ForgeLoop problem.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps To Reproduce
      description: List exact commands or prompts.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor Output
      description: Paste safe output from python -m forgeloop doctor .
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, AI coding tool, and ForgeLoop version.
    validations:
      required: true

