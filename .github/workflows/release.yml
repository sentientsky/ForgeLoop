name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install development tools
        run: |
          python -m pip install --require-hashes -r .github/requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} must equal {expected!r}")
          PY
      - name: Require release commit on protected main history
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit already present on main." >&2
            exit 1
          }
      - name: Run release gate
        run: |
          python -m ruff check forgeloop tests
          python -m coverage run -m unittest discover -s tests
          python -m coverage report
          python -m forgeloop validate .
          python -m forgeloop doctor .
          python -m forgeloop compat .
          python -m forgeloop index . --check
          python -m forgeloop secrets check .

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install build tools
        run: python -m pip install --require-hashes -r .github/requirements-ci.txt
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Test installed wheel outside the checkout
        run: python tests/package_smoke.py dist .
      - name: Build full source archive
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="ForgeLoop-${GITHUB_REF_NAME}/" "${GITHUB_SHA}" -o "dist/ForgeLoop-${GITHUB_REF_NAME}-source.zip"
      - name: Check source archive for local-only files
        run: python -m forgeloop.release_archive "dist/ForgeLoop-${GITHUB_REF_NAME}-source.zip"
      - name: Create source archive checksum
        run: cd dist && sha256sum "ForgeLoop-${GITHUB_REF_NAME}-source.zip" > "ForgeLoop-${GITHUB_REF_NAME}-source.zip.sha256"
      - name: Attest source archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*-source.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive
          path: |
            dist/*-source.zip
            dist/*-source.zip.sha256
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-archive
          path: dist/
      - name: Create or complete the GitHub source release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          archive="dist/ForgeLoop-${RELEASE_TAG}-source.zip"
          checksum="${archive}.sha256"
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            existing_assets=$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name')
            temp_dir=$(mktemp -d)
            trap 'rm -rf "$temp_dir"' EXIT
            missing_assets=()
            for asset in "$archive" "$checksum"; do
              asset_name=$(basename "$asset")
              if printf '%s\n' "$existing_assets" | grep -Fxq "$asset_name"; then
                gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --pattern "$asset_name" --dir "$temp_dir"
                if ! cmp -s "$asset" "$temp_dir/$asset_name"; then
                  echo "Existing release asset differs from the verified build: $asset_name" >&2
                  exit 1
                fi
              else
                missing_assets+=("$asset")
              fi
            done
            if ((${#missing_assets[@]})); then
              gh release upload "$RELEASE_TAG" "${missing_assets[@]}" --repo "$REPOSITORY"
            fi
          else
            gh release create "$RELEASE_TAG" "$archive" "$checksum" --repo "$REPOSITORY" --verify-tag --generate-notes --title "ForgeLoop $RELEASE_TAG (source alpha)"
          fi
