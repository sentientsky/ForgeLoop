name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Validate ForgeLoop structure
        run: python -m forgeloop validate .
      - name: Smoke test setup menu
        run: python -m forgeloop setup . --tool all-supported --dry-run
      - name: Check AI tool compatibility
        run: python -m forgeloop compat .
      - name: Run ForgeLoop doctor
        run: python -m forgeloop doctor .
      - name: Smoke test OpenCLI integration plan
        run: python -m forgeloop opencli plan .
      - name: Smoke test context packet
        run: python -m forgeloop pack "memory validation" . --limit 5
      - name: Smoke test token report
        run: python -m forgeloop tokens "memory validation" . --limit 5
      - name: Check secrets hygiene
        run: python -m forgeloop secrets check .
      - name: Check memory index
        run: python -m forgeloop index . --check
