name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests with branch coverage
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report

  quality-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint Python
        run: python -m ruff check forgeloop tests
      - name: Validate ForgeLoop
        run: |
          python -m forgeloop validate .
          python -m forgeloop setup . --tool all-supported --dry-run
          python -m forgeloop compat .
          python -m forgeloop doctor .
          python -m forgeloop opencli plan .
          python -m forgeloop pack "memory validation" . --limit 5
          python -m forgeloop tokens "memory validation" . --limit 5
          python -m forgeloop secrets check .
          python -m forgeloop index . --check
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Test installed wheel outside the checkout
        run: python tests/package_smoke.py dist .
