[project]
name = "forgeloop"
version = "0.1.0"
description = "An open source operating system for disciplined AI-assisted engineering."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ForgeLoop contributors" }
]
urls = { Homepage = "https://github.com/sentientsky/ForgeLoop", Documentation = "https://github.com/sentientsky/ForgeLoop/tree/main/docs", Issues = "https://github.com/sentientsky/ForgeLoop/issues", Source = "https://github.com/sentientsky/ForgeLoop" }
keywords = [
    "ai",
    "claude-code",
    "codex",
    "agentic-engineering",
    "memory",
    "developer-tools",
    "quality",
    "workflow",
    "open-source"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities"
]
dependencies = []

[project.scripts]
forgeloop = "forgeloop.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.6.0",
    "coverage[toml]>=7.14.0",
    "ruff>=0.15.0",
    "twine>=7.0.0",
]
tokenizers = [
    "tiktoken>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgeloop"]

[tool.forgeloop]
max_file_bytes = 1000000

[tool.coverage.run]
branch = true
source = ["forgeloop"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
